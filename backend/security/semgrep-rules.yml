# CodeCogniLint — вендоренный набор Semgrep-правил (offline, без реестра).
# Покрытие: инъекции, выполнение кода, слабая криптография, секреты, небезопасная десериализация.
# Каждое правило несёт CWE/OWASP-метаданные для отчётности.
rules:
  # ---------- Python: инъекции ----------
  - id: py-sql-injection-concat
    languages: [python]
    severity: ERROR
    message: SQL-запрос собирается конкатенацией/форматированием строк — SQL-инъекция.
    metadata:
      cwe: CWE-89
      owasp: A03:2021 Injection
    patterns:
      - pattern-either:
          - pattern: $CUR.execute("..." + ...)
          - pattern: $CUR.execute("...".format(...))
          - pattern: $CUR.execute(f"...")
          - pattern: $CUR.execute("..." % ...)

  - id: py-os-system
    languages: [python]
    severity: ERROR
    message: os.system() с динамическим аргументом — инъекция команд ОС.
    metadata:
      cwe: CWE-78
      owasp: A03:2021 Injection
    pattern: os.system(...)

  - id: py-subprocess-shell
    languages: [python]
    severity: ERROR
    message: subprocess с shell=True — риск инъекции команд.
    metadata:
      cwe: CWE-78
      owasp: A03:2021 Injection
    patterns:
      - pattern-either:
          - pattern: subprocess.run(..., shell=True, ...)
          - pattern: subprocess.call(..., shell=True, ...)
          - pattern: subprocess.Popen(..., shell=True, ...)

  - id: py-eval-exec
    languages: [python]
    severity: ERROR
    message: eval()/exec() на динамических данных — выполнение произвольного кода.
    metadata:
      cwe: CWE-95
      owasp: A03:2021 Injection
    patterns:
      - pattern-either:
          - pattern: eval(...)
          - pattern: exec(...)

  - id: py-pickle-loads
    languages: [python]
    severity: ERROR
    message: pickle.loads/load на недоверенных данных — небезопасная десериализация.
    metadata:
      cwe: CWE-502
      owasp: A08:2021 Software and Data Integrity Failures
    patterns:
      - pattern-either:
          - pattern: pickle.loads(...)
          - pattern: pickle.load(...)

  - id: py-yaml-unsafe-load
    languages: [python]
    severity: WARNING
    message: yaml.load без SafeLoader — небезопасная десериализация.
    metadata:
      cwe: CWE-502
      owasp: A08:2021 Software and Data Integrity Failures
    patterns:
      - pattern: yaml.load(...)
      - pattern-not: yaml.load(..., Loader=yaml.SafeLoader, ...)
      - pattern-not: yaml.load(..., yaml.SafeLoader, ...)

  # ---------- Python: криптография ----------
  - id: py-weak-hash
    languages: [python]
    severity: WARNING
    message: Слабый хеш (md5/sha1) — не подходит для паролей и подписей.
    metadata:
      cwe: CWE-327
      owasp: A02:2021 Cryptographic Failures
    patterns:
      - pattern-either:
          - pattern: hashlib.md5(...)
          - pattern: hashlib.sha1(...)

  - id: py-requests-no-verify
    languages: [python]
    severity: WARNING
    message: requests с verify=False — отключена проверка TLS-сертификата (MITM).
    metadata:
      cwe: CWE-295
      owasp: A02:2021 Cryptographic Failures
    patterns:
      - pattern-either:
          - pattern: requests.get(..., verify=False, ...)
          - pattern: requests.post(..., verify=False, ...)
          - pattern: requests.put(..., verify=False, ...)
          - pattern: requests.delete(..., verify=False, ...)

  - id: py-debug-mode
    languages: [python]
    severity: WARNING
    message: debug=True в production — утечка стектрейсов и интерактивная консоль.
    metadata:
      cwe: CWE-489
      owasp: A05:2021 Security Misconfiguration
    patterns:
      - pattern-either:
          - pattern: $APP.run(..., debug=True, ...)
          - pattern: $APP.debug = True

  - id: py-hardcoded-password
    languages: [python]
    severity: ERROR
    message: Пароль/секрет захардкожен в коде.
    metadata:
      cwe: CWE-798
      owasp: A07:2021 Identification and Authentication Failures
    patterns:
      - pattern-regex: (?i)(password|passwd|pwd|secret|api_key|token)\s*=\s*["'][^"']{4,}["']

  # ---------- JavaScript / TypeScript ----------
  - id: js-eval
    languages: [javascript, typescript]
    severity: ERROR
    message: eval() — выполнение произвольного кода.
    metadata:
      cwe: CWE-95
      owasp: A03:2021 Injection
    pattern: eval(...)

  - id: js-innerhtml
    languages: [javascript, typescript]
    severity: WARNING
    message: innerHTML из динамических данных — риск XSS.
    metadata:
      cwe: CWE-79
      owasp: A03:2021 Injection
    patterns:
      - pattern-either:
          - pattern: $EL.innerHTML = ...
          - pattern: $EL.outerHTML = ...
      - pattern-not: $EL.innerHTML = "..."
      - pattern-not: $EL.outerHTML = "..."

  - id: js-dangerously-set-html
    languages: [javascript, typescript]
    severity: WARNING
    message: dangerouslySetInnerHTML — риск XSS без санитизации.
    metadata:
      cwe: CWE-79
      owasp: A03:2021 Injection
    pattern: <$EL dangerouslySetInnerHTML={...} />

  - id: js-document-write
    languages: [javascript, typescript]
    severity: WARNING
    message: document.write — риск XSS.
    metadata:
      cwe: CWE-79
      owasp: A03:2021 Injection
    pattern: document.write(...)

  - id: js-child-process-exec
    languages: [javascript, typescript]
    severity: ERROR
    message: child_process.exec с динамической строкой — инъекция команд ОС.
    metadata:
      cwe: CWE-78
      owasp: A03:2021 Injection
    pattern: child_process.exec(...)
