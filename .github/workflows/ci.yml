name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Compile check
        run: python -m compileall -q backend

      - name: Import check
        working-directory: backend
        run: python -c "from main import app; print('FastAPI app import OK:', app.title)"

      - name: Install dev deps & run tests
        working-directory: backend
        run: |
          pip install -r requirements-dev.txt
          python -m pytest tests/ -q

  frontend:
    name: Frontend (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  security:
    name: Security gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Жёсткий гейт: любая находка вендоренных правил роняет CI
      - name: SAST gate (Semgrep)
        run: |
          pip install semgrep==1.175.0
          semgrep scan --config backend/security/semgrep-rules.yml \
            --error --metrics off backend/ frontend/src/

      # SCA: зависимости не должны содержать известных CVE
      - name: SCA gate (pip-audit)
        run: |
          pip install pip-audit==2.9.0
          pip-audit -r backend/requirements.txt --progress-spinner off

      # Frontend-зависимости — совещательно (registry churn не должен блокировать CI)
      - name: npm audit (advisory)
        working-directory: frontend
        continue-on-error: true
        run: npm audit --omit=dev

  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Ratchet-гейт: бюджеты качества из .ccl-quality.yml; регресс роняет CI
      - name: Quality gate
        run: |
          pip install -r backend/requirements.txt
          python backend/quality_gate.py .
