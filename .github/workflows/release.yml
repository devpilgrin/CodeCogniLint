name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build & publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Backend compile check
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          python -m compileall -q backend

      - name: Build frontend
        working-directory: frontend
        run: |
          npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version
          npm ci
          npm run build

      - name: Assemble release bundle
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BUNDLE="CodeCogniLint-$VERSION"
          mkdir -p "dist/$BUNDLE/backend" "dist/$BUNDLE/frontend"

          # Backend: исходники без артефактов окружения
          rsync -a \
            --exclude ".venv" --exclude "__pycache__" --exclude ".env" \
            --exclude "projects" --exclude ".deps-ok" \
            backend/ "dist/$BUNDLE/backend/"

          # Frontend: исходники + готовая сборка dist
          rsync -a \
            --exclude "node_modules" \
            frontend/ "dist/$BUNDLE/frontend/"

          # Скрипты запуска и документация
          cp start-all.sh start-backend.sh start-frontend.sh \
             start-all.bat start-backend.bat start-frontend.bat \
             README.md LICENSE "dist/$BUNDLE/"
          echo "$VERSION" > "dist/$BUNDLE/VERSION"

          cd dist
          tar -czf "CodeCogniLint-$VERSION-linux-macos.tar.gz" "$BUNDLE"
          zip -qr "CodeCogniLint-$VERSION-windows.zip" "$BUNDLE"
          ls -lh

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: CodeCogniLint ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/CodeCogniLint-${{ steps.version.outputs.version }}-linux-macos.tar.gz
            dist/CodeCogniLint-${{ steps.version.outputs.version }}-windows.zip
